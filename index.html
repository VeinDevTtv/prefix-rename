<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rename Folder Prefix</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Rename Folder Prefix</h1>
        <form id="renameForm">
            <div class="form-group">
                <label for="directory">Directory:</label>
                <input type="text" id="directory" name="directory" required>
            </div>
            <div class="form-group">
                <label for="oldPrefix">Old Prefix:</label>
                <input type="text" id="oldPrefix" name="oldPrefix" required>
            </div>
            <div class="form-group">
                <label for="newPrefix">New Prefix:</label>
                <input type="text" id="newPrefix" name="newPrefix" required>
            </div>
            <div class="form-group">
                <input type="checkbox" id="dryRun" name="dryRun">
                <label for="dryRun">Dry-Run</label>
            </div>
            <div class="form-group">
                <input type="checkbox" id="ignoreCase" name="ignoreCase">
                <label for="ignoreCase">Ignore Case</label>
            </div>
            <button type="submit">Rename</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
